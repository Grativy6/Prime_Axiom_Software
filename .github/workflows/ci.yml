name: build-000-and-001-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Verify Build 001 and immutable Build 000 evidence
        shell: pwsh
        run: >-
          & ./scripts/verify-build001.ps1
          -SkipBenchmarks
          -OutputDirectory artifacts/build001-ci

      - name: Upload receipts
        uses: actions/upload-artifact@v6
        with:
          name: build001-${{ runner.os }}-sanitized-receipts
          path: artifacts/build001-ci
          if-no-files-found: error
